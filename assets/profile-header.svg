<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Marcos Neto — Desenvolvedor Back-end, Sistemas Web e Automação</title>
  <desc id="desc">Banner do perfil de Marcos Neto inspirado no design do portfólio marcosneto.dev: Eu transformo problemas operacionais em produtos que funcionam.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#001523"/>
      <stop offset="55%" stop-color="#001F35"/>
      <stop offset="100%" stop-color="#002945"/>
    </linearGradient>
    <radialGradient id="ambientA" cx="85%" cy="22%" r="45%">
      <stop offset="0%" stop-color="#7ED1EF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#7ED1EF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ambientB" cx="12%" cy="80%" r="40%">
      <stop offset="0%" stop-color="#ADDFF1" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ADDFF1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="archGrid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#ADDFF1" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <style>
      .sans { font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .mono { font-family: 'DM Mono', 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
      .brand-name { font-size: 16px; font-weight: 800; fill: #F4FBFD; letter-spacing: -0.4px; }
      .brand-mark-text { font-size: 13px; font-weight: 700; fill: #003152; }
      .nav-item { font-size: 12px; font-weight: 500; fill: #A9C7D2; letter-spacing: 0.8px; }
      .kicker { font-size: 12px; font-weight: 500; fill: #ADDFF1; letter-spacing: 1.5px; }
      .hero-title { font-size: 40px; font-weight: 800; fill: #F4FBFD; letter-spacing: -1.4px; }
      .hero-accent { font-size: 40px; font-weight: 800; fill: #ADDFF1; letter-spacing: -1.4px; }
      .hero-lead { font-size: 14.5px; font-weight: 400; fill: #A9C7D2; }
      .fact-num { font-size: 22px; font-weight: 600; fill: #ADDFF1; }
      .fact-label { font-size: 11.5px; font-weight: 400; fill: #A9C7D2; }
      .card-bar { font-size: 11px; font-weight: 500; fill: #A9C7D2; }
      .step-num { font-size: 12px; font-weight: 600; fill: #ADDFF1; }
      .step-title { font-size: 13.5px; font-weight: 700; fill: #F4FBFD; }
      .step-desc { font-size: 12px; font-weight: 400; fill: #A9C7D2; }
      .chip { font-size: 11px; font-weight: 500; fill: #D9EDF4; }
    </style>
  </defs>

  <!-- Background & Ambient Glow -->
  <rect width="1200" height="420" rx="12" fill="url(#bgGrad)"/>
  <rect width="1200" height="420" rx="12" fill="url(#archGrid)"/>
  <rect width="1200" height="420" rx="12" fill="url(#ambientA)"/>
  <rect width="1200" height="420" rx="12" fill="url(#ambientB)"/>

  <!-- Top Progress Line -->
  <rect x="0" y="0" width="1200" height="3" fill="#003152"/>
  <rect x="0" y="0" width="460" height="3" fill="#ADDFF1"/>

  <!-- Topbar -->
  <g transform="translate(56, 24)">
    <!-- Brand Mark [MN] -->
    <rect x="0" y="0" width="32" height="32" fill="#ADDFF1"/>
    <text x="16" y="21" text-anchor="middle" class="mono brand-mark-text">MN</text>
    <text x="44" y="22" class="sans brand-name">marcosneto.dev</text>

    <!-- Nav Indicators -->
    <text x="410" y="21" class="mono nav-item">01 SOBRE    ·    02 PROJETOS    ·    03 PROCESSO    ·    04 STACK</text>

    <!-- Availability Badge -->
    <g transform="translate(818, 1)">
      <rect x="0" y="0" width="270" height="30" fill="#003152" fill-opacity="0.65" stroke="#ADDFF1" stroke-opacity="0.28"/>
      <circle cx="16" cy="15" r="4" fill="#ADDFF1"/>
      <circle cx="16" cy="15" r="7" fill="#ADDFF1" fill-opacity="0.22"/>
      <text x="30" y="19" class="mono" font-size="10.5" fill="#D9EDF4" letter-spacing="0.7">ABERTO A OPORTUNIDADES E PROJETOS</text>
    </g>

    <!-- Topbar Divider -->
    <line x1="0" y1="46" x2="1088" y2="46" stroke="#ADDFF1" stroke-opacity="0.16" stroke-width="1"/>
  </g>

  <!-- Left Column: Hero Copy -->
  <g transform="translate(56, 104)">
    <text x="0" y="14" class="mono kicker">BACK-END · SISTEMAS WEB · AUTOMAÇÃO</text>

    <text x="0" y="64" class="sans hero-title">Eu transformo problemas</text>
    <text x="0" y="110" class="sans hero-title">operacionais em <tspan class="hero-accent">produtos</tspan></text>
    <text x="0" y="156" class="sans hero-accent">que funcionam.</text>

    <text x="0" y="194" class="sans hero-lead">Estudante de Ciência da Computação na UNIFACISA. Desenvolvo sistemas com</text>
    <text x="0" y="215" class="sans hero-lead">back-end bem estruturado, interfaces claras e foco em resolver problemas reais.</text>

    <!-- Hero Facts Divider -->
    <line x1="0" y1="240" x2="640" y2="240" stroke="#ADDFF1" stroke-opacity="0.16" stroke-width="1"/>

    <!-- Fact 01 -->
    <g transform="translate(0, 256)">
      <text x="0" y="24" class="mono fact-num">04</text>
      <text x="38" y="13" class="sans fact-label">produtos e sistemas</text>
      <text x="38" y="28" class="sans fact-label">publicados</text>
    </g>

    <!-- Fact 02 -->
    <g transform="translate(210, 256)">
      <text x="0" y="24" class="mono fact-num">CC</text>
      <text x="42" y="13" class="sans fact-label">Ciência da Computação</text>
      <text x="42" y="28" class="sans fact-label">UNIFACISA</text>
    </g>

    <!-- Fact 03 -->
    <g transform="translate(430, 256)">
      <text x="0" y="24" class="mono fact-num">Full</text>
      <text x="54" y="13" class="sans fact-label">back-end primeiro,</text>
      <text x="54" y="28" class="sans fact-label">produto completo</text>
    </g>
  </g>

  <!-- Right Column: Architectural Process & Status Window -->
  <g transform="translate(744, 96)">
    <!-- Main Surface Card -->
    <rect x="0" y="0" width="400" height="292" fill="#003152" stroke="#ADDFF1" stroke-opacity="0.32" stroke-width="1"/>

    <!-- Window Bar -->
    <rect x="0" y="0" width="400" height="34" fill="#00243C"/>
    <line x1="0" y1="34" x2="400" y2="34" stroke="#ADDFF1" stroke-opacity="0.16" stroke-width="1"/>
    <circle cx="16" cy="17" r="3.5" fill="#47758D"/>
    <circle cx="28" cy="17" r="3.5" fill="#47758D"/>
    <circle cx="40" cy="17" r="3.5" fill="#ADDFF1"/>
    <text x="56" y="21" class="mono card-bar">marcosneto.dev // como-eu-construo</text>

    <!-- Step 01 -->
    <g transform="translate(24, 54)">
      <rect x="0" y="0" width="2" height="38" fill="#ADDFF1"/>
      <text x="14" y="15" class="mono step-num">01</text>
      <text x="40" y="15" class="sans step-title">Problema antes da tecnologia</text>
      <text x="40" y="33" class="sans step-desc">Entender a operação antes de escolher ferramentas.</text>
    </g>

    <!-- Step 02 -->
    <g transform="translate(24, 110)">
      <rect x="0" y="0" width="2" height="38" fill="#7ED1EF"/>
      <text x="14" y="15" class="mono step-num">02</text>
      <text x="40" y="15" class="sans step-title">Regra de negócio explícita</text>
      <text x="40" y="33" class="sans step-desc">Fluxos claros, seguros, rastreáveis e auditáveis.</text>
    </g>

    <!-- Step 03 -->
    <g transform="translate(24, 166)">
      <rect x="0" y="0" width="2" height="38" fill="#ADDFF1"/>
      <text x="14" y="15" class="mono step-num">03</text>
      <text x="40" y="15" class="sans step-title">Entrega de ponta a ponta</text>
      <text x="40" y="33" class="sans step-desc">Do banco de dados até a interface de quem opera.</text>
    </g>

    <!-- Bottom Status Strip -->
    <line x1="24" y1="224" x2="376" y2="224" stroke="#ADDFF1" stroke-opacity="0.16" stroke-width="1"/>
    <g transform="translate(24, 240)">
      <rect x="0" y="0" width="76" height="28" fill="#001523" stroke="#ADDFF1" stroke-opacity="0.28"/>
      <text x="38" y="18" text-anchor="middle" class="mono chip">Java 21</text>

      <rect x="84" y="0" width="96" height="28" fill="#001523" stroke="#ADDFF1" stroke-opacity="0.28"/>
      <text x="132" y="18" text-anchor="middle" class="mono chip">Spring Boot</text>

      <rect x="188" y="0" width="90" height="28" fill="#001523" stroke="#ADDFF1" stroke-opacity="0.28"/>
      <text x="233" y="18" text-anchor="middle" class="mono chip">TypeScript</text>

      <rect x="286" y="0" width="66" height="28" fill="#ADDFF1"/>
      <text x="319" y="18" text-anchor="middle" class="mono" font-size="10.5" font-weight="700" fill="#003152">ACTIVE</text>
    </g>
  </g>
</svg>
