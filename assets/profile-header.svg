<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Marcos Neto — Desenvolvedor Back-end Java &amp; Produtos Digitais</title>
  <desc id="desc">Banner editorial roxo do perfil de Marcos Neto inspirado em marcosneto.dev: Back-end primeiro. Produto completo.</desc>
  <defs>
    <!-- Exact Hero Radial Gradient from editorial.css: radial-gradient(ellipse at 68% 30%, #9664dc, #733dbb 60%, #542489) -->
    <radialGradient id="heroPurple" cx="68%" cy="30%" r="75%" fx="68%" fy="30%">
      <stop offset="0%" stop-color="#9664DC"/>
      <stop offset="58%" stop-color="#733DBB"/>
      <stop offset="100%" stop-color="#481D78"/>
    </radialGradient>
    <linearGradient id="topbarBg" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B0810" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#110D18" stop-opacity="0.96"/>
    </linearGradient>
    <linearGradient id="progressBar" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#C4B5FD"/>
    </linearGradient>
    <pattern id="editorialGrid" width="120" height="120" patternUnits="userSpaceOnUse">
      <path d="M 120 0 L 0 0 0 120" fill="none" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#170929" flood-opacity="0.42"/>
    </filter>
    <style>
      .sans { font-family: 'Manrope', 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .mono { font-family: 'DM Mono', 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
      .watermark { font-size: 138px; font-weight: 800; fill: #FFFFFF; fill-opacity: 0.07; letter-spacing: -6px; }
      .brand-name { font-size: 15px; font-weight: 800; fill: #F7F5FC; letter-spacing: -0.3px; }
      .brand-mark-text { font-size: 12px; font-weight: 700; fill: #F7F5FC; }
      .nav-item { font-size: 12px; font-weight: 500; fill: #BCB3C9; letter-spacing: 0.6px; }
      .kicker { font-size: 12px; font-weight: 500; fill: #EADFF8; letter-spacing: 1.6px; }
      .hero-lead { font-size: 14.5px; font-weight: 500; fill: #FFFFFF; }
      .hero-giant { font-size: 86px; font-weight: 800; fill: #FFFFFF; letter-spacing: -4.5px; }
      .card-bar { font-size: 11px; font-weight: 500; fill: #BCB3C9; }
      .step-num { font-size: 11.5px; font-weight: 600; fill: #D5BDFF; }
      .step-title { font-size: 13.5px; font-weight: 700; fill: #F7F5FC; }
      .step-desc { font-size: 12px; font-weight: 400; fill: #BCB3C9; }
      .chip { font-size: 11px; font-weight: 500; fill: #F7F5FC; }
    </style>
  </defs>

  <!-- Main Purple Editorial Background -->
  <rect width="1200" height="420" rx="14" fill="url(#heroPurple)"/>
  <rect width="1200" height="420" rx="14" fill="url(#editorialGrid)"/>

  <!-- Giant Background Watermark ('MARCOS NETO' from editorial.css .hero::before) -->
  <text x="48" y="182" class="sans watermark">MARCOS NETO</text>

  <!-- Top Dark Editorial Bar (#0b0810) -->
  <rect x="0" y="0" width="1200" height="58" rx="14" fill="url(#topbarBg)"/>
  <rect x="0" y="44" width="1200" height="14" fill="url(#topbarBg)"/>
  <line x1="0" y1="58" x2="1200" y2="58" stroke="#D5BDFF" stroke-opacity="0.18" stroke-width="1"/>

  <!-- Top Gradient Progress Strip -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#progressBar)"/>

  <!-- Topbar Content -->
  <g transform="translate(52, 15)">
    <!-- Brand Mark [MN] -->
    <rect x="0" y="0" width="28" height="28" rx="6" fill="#7943D1"/>
    <text x="14" y="18.5" text-anchor="middle" class="mono brand-mark-text">MN</text>
    <text x="40" y="19.5" class="sans brand-name">Marcos Neto</text>

    <!-- Nav Links -->
    <text x="415" y="19" class="mono nav-item">01 PERFIL    ·    02 CASES    ·    03 STACK    ·    04 PROCESSO</text>

    <!-- Availability Pill -->
    <g transform="translate(838, 0)">
      <rect x="0" y="0" width="258" height="28" rx="14" fill="#21192E" stroke="#D5BDFF" stroke-opacity="0.32"/>
      <circle cx="15" cy="14" r="4" fill="#5EE6A8"/>
      <circle cx="15" cy="14" r="7" fill="#5EE6A8" fill-opacity="0.22"/>
      <text x="28" y="18" class="mono" font-size="10.5" fill="#F7F5FC" letter-spacing="0.5">DISPONÍVEL PARA OPORTUNIDADES</text>
    </g>
  </g>

  <!-- Left Column: Hero Editorial Copy -->
  <g transform="translate(52, 92)">
    <!-- Eyebrow Pill -->
    <rect x="0" y="0" width="248" height="26" rx="4" fill="#321247" fill-opacity="0.55" stroke="#FFFFFF" stroke-opacity="0.28"/>
    <text x="12" y="17" class="mono kicker" font-size="10.5">DESENVOLVEDOR BACK-END JAVA</text>

    <text x="0" y="58" class="sans hero-lead">Transformando regras de negócio, documentos e rotinas</text>
    <text x="0" y="80" class="sans hero-lead">operacionais em produtos digitais seguros e fáceis de evoluir.</text>
    <text x="0" y="106" class="mono" font-size="12" fill="#EADFF8">🎓 Ciência da Computação · UNIFACISA   |   Back-end primeiro. Produto completo.</text>

    <!-- Action Pills -->
    <g transform="translate(0, 128)">
      <rect x="0" y="0" width="166" height="36" rx="6" fill="#FFFFFF"/>
      <text x="83" y="23" text-anchor="middle" class="sans" font-size="12.5" font-weight="800" fill="#251236">marcosneto.dev ↗</text>

      <rect x="178" y="0" width="150" height="36" rx="6" fill="#38174C" fill-opacity="0.45" stroke="#FFFFFF" stroke-opacity="0.55"/>
      <text x="253" y="23" text-anchor="middle" class="mono" font-size="11.5" font-weight="500" fill="#FFFFFF">03 Cases Reais</text>

      <rect x="340" y="0" width="174" height="36" rx="6" fill="#38174C" fill-opacity="0.45" stroke="#FFFFFF" stroke-opacity="0.55"/>
      <text x="427" y="23" text-anchor="middle" class="mono" font-size="11.5" font-weight="500" fill="#FFFFFF">02 Em Produção</text>
    </g>

    <!-- Giant Editorial Title at Bottom (matching .hero h1 in editorial.css) -->
    <text x="-4" y="264" class="sans hero-giant">MARCOS NETO.</text>
  </g>

  <!-- Right Column: Dark Purple Editorial Card (#17121f) -->
  <g transform="translate(736, 86)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="412" height="298" rx="10" fill="#17121F" stroke="#D5BDFF" stroke-opacity="0.28" stroke-width="1"/>

    <!-- Window Bar -->
    <rect x="0" y="0" width="412" height="36" rx="10" fill="#110D18"/>
    <rect x="0" y="24" width="412" height="12" fill="#110D18"/>
    <line x1="0" y1="36" x2="412" y2="36" stroke="#D5BDFF" stroke-opacity="0.18" stroke-width="1"/>
    <circle cx="18" cy="18" r="4" fill="#7943D1"/>
    <circle cx="31" cy="18" r="4" fill="#A78BFA"/>
    <circle cx="44" cy="18" r="4" fill="#5EE6A8"/>
    <text x="60" y="22" class="mono card-bar">marcosneto.dev // tecnologia-aplicada</text>

    <!-- Principle 01 -->
    <g transform="translate(24, 54)">
      <rect x="0" y="0" width="3" height="40" rx="1.5" fill="#8B5CF6"/>
      <text x="14" y="15" class="mono step-num">01</text>
      <text x="40" y="15" class="sans step-title">Problema antes da tecnologia</text>
      <text x="40" y="34" class="sans step-desc">Mapeio pessoas, etapas e exceções antes da ferramenta.</text>
    </g>

    <!-- Principle 02 -->
    <g transform="translate(24, 112)">
      <rect x="0" y="0" width="3" height="40" rx="1.5" fill="#C4A4FF"/>
      <text x="14" y="15" class="mono step-num">02</text>
      <text x="40" y="15" class="sans step-title">Regra de negócio explícita</text>
      <text x="40" y="34" class="sans step-desc">Estados e validações claros tornam o sistema confiável.</text>
    </g>

    <!-- Principle 03 -->
    <g transform="translate(24, 170)">
      <rect x="0" y="0" width="3" height="40" rx="1.5" fill="#5EE6A8"/>
      <text x="14" y="15" class="mono step-num">03</text>
      <text x="40" y="15" class="sans step-title">Entrega de ponta a ponta</text>
      <text x="40" y="34" class="sans step-desc">Do banco de dados à experiência de quem opera o produto.</text>
    </g>

    <!-- Capabilities Bar at Bottom -->
    <line x1="24" y1="230" x2="388" y2="230" stroke="#D5BDFF" stroke-opacity="0.18" stroke-width="1"/>
    <g transform="translate(24, 246)">
      <rect x="0" y="0" width="68" height="28" rx="5" fill="#21192E" stroke="#D5BDFF" stroke-opacity="0.24"/>
      <text x="34" y="18" text-anchor="middle" class="mono chip">Java 21</text>

      <rect x="76" y="0" width="92" height="28" rx="5" fill="#21192E" stroke="#D5BDFF" stroke-opacity="0.24"/>
      <text x="122" y="18" text-anchor="middle" class="mono chip">Spring Boot</text>

      <rect x="176" y="0" width="88" height="28" rx="5" fill="#21192E" stroke="#D5BDFF" stroke-opacity="0.24"/>
      <text x="220" y="18" text-anchor="middle" class="mono chip">PostgreSQL</text>

      <rect x="272" y="0" width="92" height="28" rx="5" fill="#7943D1"/>
      <text x="318" y="18" text-anchor="middle" class="mono" font-size="10.5" font-weight="700" fill="#FFFFFF">Django/React</text>
    </g>
  </g>
</svg>
